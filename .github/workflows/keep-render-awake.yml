name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Ping NETRA AI health endpoint
        run: |
          curl --fail --silent --show-error \
          --max-time 60 \
          https://NETRA-ai-api.onrender.com/api/health